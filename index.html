<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SATHI — Your Classroom AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
</head>
<body>

  <!-- boot screen -->
  <div id="boot-screen">
    <div class="boot-line" id="boot-text"></div>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="orb"><span class="orb-core"></span></div>
        <div class="brand-text">
          <h1>SATHI<span class="dot">.ai</span></h1>
          <p class="tagline">class companion, still learning</p>
        </div>
      </div>
      <div class="status">
        <span class="status-dot"></span> online
      </div>
    </header>

    <main class="chat-window" id="chat-window">
      <!-- messages injected here -->
    </main>

    <div class="suggestions" id="suggestions">
      <button class="chip" data-msg="who is kalu">who is kalu?</button>
      <button class="chip" data-msg="who made you">who made you?</button>
      <button class="chip" data-msg="tell me a fact">tell me a fact</button>
    </div>

    <form class="composer" id="composer">
      <input
        id="user-input"
        type="text"
        autocomplete="off"
        placeholder="Type a message…"
        aria-label="Type a message"
      />
      <button type="submit" id="send-btn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M3 11L21 3L13 21L11 13L3 11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
